name: Deploy Portfolio

on:
  workflow_dispatch:
    inputs:
      target:
        description: VPS tujuan
        type: choice
        required: true
        default: oci-arm64
        options:
          - oci-arm64
          - vps-amd64

concurrency:
  group: portfolio-deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Deploy selected VPS
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          OCI_VPS_HOST: ${{ secrets.OCI_VPS_HOST }}
          OCI_VPS_USER: ${{ secrets.OCI_VPS_USER }}
          OCI_VPS_SSH_KEY: ${{ secrets.OCI_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            oci-arm64)
              deploy_host="$OCI_VPS_HOST"
              deploy_user="$OCI_VPS_USER"
              deploy_key="$OCI_VPS_SSH_KEY"
              portfolio_arch=arm64
              ;;
            vps-amd64)
              deploy_host="$VPS_HOST"
              deploy_user="$VPS_USER"
              deploy_key="$VPS_SSH_KEY"
              portfolio_arch=amd64
              ;;
            *)
              echo "Unknown deployment target" >&2
              exit 1
              ;;
          esac

          if [[ -z "$deploy_host" || -z "$deploy_user" || -z "$deploy_key" ]]; then
            echo "Missing production secret for $TARGET" >&2
            exit 1
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          key_file="$temp_dir/deploy_key"
          known_hosts_file="$temp_dir/known_hosts"
          printf '%s\n' "$deploy_key" > "$key_file"
          chmod 600 "$key_file"

          if ! ssh-keyscan -T 10 -H "$deploy_host" > "$known_hosts_file" 2>/dev/null || [[ ! -s "$known_hosts_file" ]]; then
            echo "Could not retrieve SSH host key for $TARGET" >&2
            exit 1
          fi

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$known_hosts_file" \
            -i "$key_file" \
            "$deploy_user@$deploy_host" \
            "PORTFOLIO_ARCH=$portfolio_arch bash -s" <<'REMOTE'
          set -eu
          cd /opt/apps/zaidus-portfolio
          sudo -n env PORTFOLIO_ARCH="$PORTFOLIO_ARCH" docker compose config --services
          sudo -n env PORTFOLIO_ARCH="$PORTFOLIO_ARCH" docker compose pull
          sudo -n env PORTFOLIO_ARCH="$PORTFOLIO_ARCH" docker compose up -d --remove-orphans
          REMOTE
