name: Deploy Portfolio

on:
  workflow_dispatch:
    inputs:
      target:
        description: VPS tujuan
        type: choice
        required: true
        default: oci-arm64
        options:
          - oci-arm64
          - vps-amd64

concurrency:
  group: portfolio-deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  actions: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require successful image build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          successful_builds="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${GITHUB_SHA}&branch=main&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"

          if [[ "$successful_builds" == "0" ]]; then
            echo "No successful image build found for $GITHUB_SHA on main" >&2
            exit 1
          fi

      - name: Deploy selected VPS
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          OCI_VPS_HOST: ${{ secrets.OCI_VPS_HOST }}
          OCI_VPS_USER: ${{ secrets.OCI_VPS_USER }}
          OCI_VPS_SSH_KEY: ${{ secrets.OCI_VPS_SSH_KEY }}
          OCI_VPS_HOST_FINGERPRINT: ${{ vars.OCI_VPS_HOST_FINGERPRINT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ vars.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            oci-arm64)
              deploy_host="$OCI_VPS_HOST"
              deploy_user="$OCI_VPS_USER"
              deploy_key="$OCI_VPS_SSH_KEY"
              deploy_fingerprint="$OCI_VPS_HOST_FINGERPRINT"
              target_arch=arm64
              ;;
            vps-amd64)
              deploy_host="$VPS_HOST"
              deploy_user="$VPS_USER"
              deploy_key="$VPS_SSH_KEY"
              deploy_fingerprint="$VPS_HOST_FINGERPRINT"
              target_arch=amd64
              ;;
            *)
              echo "Unknown deployment target" >&2
              exit 1
              ;;
          esac

          if [[ -z "$deploy_host" || -z "$deploy_user" || -z "$deploy_key" || -z "$deploy_fingerprint" ]]; then
            echo "Missing production secret or host fingerprint Variable for $TARGET" >&2
            exit 1
          fi

          if [[ "$deploy_host" == -* || "$deploy_fingerprint" != SHA256:* ]]; then
            echo "Invalid host or SSH fingerprint configuration for $TARGET" >&2
            exit 1
          fi

          image_ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/zaidus-portfolio:${GITHUB_SHA}"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          umask 077

          key_file="$temp_dir/deploy_key"
          scan_file="$temp_dir/host_keys"
          candidate_file="$temp_dir/candidate_key"
          known_hosts_file="$temp_dir/known_hosts"
          printf '%s\n' "$deploy_key" > "$key_file"

          if ! ssh-keyscan -T 10 -H -t ed25519 "$deploy_host" > "$scan_file" 2>/dev/null || [[ ! -s "$scan_file" ]]; then
            echo "Could not retrieve an Ed25519 SSH host key for $TARGET" >&2
            exit 1
          fi

          while IFS= read -r candidate_line; do
            [[ -z "$candidate_line" || "$candidate_line" == \#* ]] && continue
            printf '%s\n' "$candidate_line" > "$candidate_file"
            candidate_fingerprint="$(ssh-keygen -lf "$candidate_file" -E sha256 | awk '{print $2}')"
            if [[ "$candidate_fingerprint" == "$deploy_fingerprint" ]]; then
              printf '%s\n' "$candidate_line" >> "$known_hosts_file"
            fi
          done < "$scan_file"

          if [[ ! -s "$known_hosts_file" ]]; then
            echo "SSH host fingerprint mismatch for $TARGET" >&2
            exit 1
          fi

          printf -v remote_command 'IMAGE_REF=%q TARGET_ARCH=%q bash -s' "$image_ref" "$target_arch"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o PubkeyAuthentication=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$known_hosts_file" \
            -i "$key_file" \
            "$deploy_user@$deploy_host" \
            "$remote_command" <<'REMOTE'
          set -euo pipefail

          case "$TARGET_ARCH" in
            arm64) expected_machine=aarch64 ;;
            amd64) expected_machine=x86_64 ;;
            *) echo "Unknown target architecture" >&2; exit 1 ;;
          esac

          actual_machine="$(uname -m)"
          if [[ "$actual_machine" != "$expected_machine" ]]; then
            echo "Target architecture mismatch: expected $expected_machine, got $actual_machine" >&2
            exit 1
          fi

          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/[a-zA-Z0-9._/-]+:[0-9a-f]{40}$ ]]; then
            echo "Invalid image reference" >&2
            exit 1
          fi

          cd /opt/apps/zaidus-portfolio
          override_file="$(mktemp)"
          trap 'rm -f "$override_file"' EXIT
          cat > "$override_file" <<EOF
          services:
            portfolio:
              image: $IMAGE_REF
          EOF

          compose() {
            sudo -n docker compose -f compose.yaml -f "$override_file" "$@"
          }

          compose config --quiet
          compose pull portfolio
          compose up -d --no-deps portfolio

          container_id="$(compose ps -q portfolio)"
          if [[ -z "$container_id" ]]; then
            echo "Portfolio container was not created" >&2
            exit 1
          fi

          container_status="$(sudo -n docker inspect --format '{{.State.Status}}' "$container_id")"
          container_image="$(sudo -n docker inspect --format '{{.Config.Image}}' "$container_id")"
          if [[ "$container_status" != running || "$container_image" != "$IMAGE_REF" ]]; then
            echo "Portfolio container is not running the requested image" >&2
            exit 1
          fi
          REMOTE
